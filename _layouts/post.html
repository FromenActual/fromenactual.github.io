---
layout: base
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  {%- include post-nav.html %}

  {%- assign pdate = page.date | date_to_xmlschema -%}

  <div class="post-layout">
    <nav class="post-toc" id="post-toc" aria-label="Table of contents">
      <div class="post-toc-card">
        {%- if page.thumbnail %}
          <img src="{{ page.thumbnail.src }}" alt="{{ page.title }}" class="post-toc-thumbnail{% if page.thumbnail.full %} post-toc-thumbnail--full{% endif %}">
        {%- endif %}
        <time class="post-toc-date" datetime="{{ pdate }}">{{ page.date | date_to_string }}</time>
        <div class="post-toc-title">{{ page.title }}</div>
        {%- if page.description %}
          <div class="post-toc-excerpt">{{ page.description }}</div>
        {%- endif %}
      </div>
    </nav>

    <div class="post-content e-content" itemprop="articleBody">
      {{ content }}
    </div>
  </div>

  {%- include post-nav.html %}

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
